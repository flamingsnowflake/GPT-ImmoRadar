# Example Apache vhost for GPT-ImmoRadar browser-facing APIs.
# Replace monitor.example.invalid and certificate paths for your deployment.

<VirtualHost *:443>
    ServerName monitor.example.invalid

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/monitor.example.invalid/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/monitor.example.invalid/privkey.pem

    ProxyPreserveHost On

    <Location "/browser-enrich">
        <LimitExcept POST>
            Require all denied
        </LimitExcept>

        LimitRequestBody 2097152

        ProxyPass "http://127.0.0.1:8765/enrich" connectiontimeout=5 timeout=20
        ProxyPassReverse "http://127.0.0.1:8765/enrich"

        RequestHeader set X-Forwarded-Proto "https"
        Header always set Cache-Control "no-store"
    </Location>

    <Location "/immobilien-energy/energy">
        <LimitExcept POST>
            Require all denied
        </LimitExcept>

        LimitRequestBody 65536

        ProxyPass "http://127.0.0.1:8090/energy" connectiontimeout=5 timeout=15
        ProxyPassReverse "http://127.0.0.1:8090/energy"

        RequestHeader set X-Forwarded-Proto "https"
        Header always set Cache-Control "no-store"
    </Location>

    # API-only host: reject unrelated paths.
    <LocationMatch "^/(?!browser-enrich$|immobilien-energy/energy$)">
        Require all denied
    </LocationMatch>

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
</VirtualHost>
