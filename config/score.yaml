# Example scoring profile for a public/self-hosted installation.
#
# These values are intentionally generic. Copy to score.yaml and adapt them to
# your own budget, property type, risk tolerance and location priorities.

location_weighting:
  enabled: false
  reference_name: Exampletown
  latitude: 51.0000000
  longitude: 11.0000000
  max_distance_km: 100
  existing_score_weight: 0.80
  proximity_score_weight: 0.20

house:
  hard_filters:
    # Purchase price plus known necessary condition costs; unknown condition stays open.
    max_price: 300000
    min_plot_area: 1000

  scoring:
    price:
      weight: 25
      condition_surcharge:
        turnkey: 0
        good: 15000
        maintained: 15000
        cosmetic_renovation: 40000
        renovation_needed: 80000
        major_renovation: 140000
        dilapidated: 220000
        unknown: 100000
      brackets:
        - {max: 130000, points: 25}
        - {max: 160000, points: 22}
        - {max: 190000, points: 19}
        - {max: 220000, points: 16}
        - {max: 250000, points: 13}
        - {max: 275000, points: 9}
        - {max: 300000, points: 5}
        - {max: 310000, points: 0}
        - {max: 320000, points: -5}
        - {max: 330000, points: -15}
        - {max: 340000, points: -25}
        - {max: 350000, points: -35}
        - {max: null, points: -40}

    plot_area:
      weight: 20
      brackets:
        - {min: 5000, points: 20}
        - {min: 3000, points: 15}
        - {min: 2000, points: 10}
        - {min: 1500, points: 7}
        - {min: 1000, points: 3}

    neighbours:
      weight: 25
      values:
        isolated: 25
        few_neighbours: 20
        loose_development: 12
        village_edge: 7
        village: 3
        dense: 0

    quiet:
      weight: 15

    water:
      weight: 10

    living_area:
      weight: 5
      brackets:
        - {min: 150, points: 5}
        - {min: 120, points: 4}
        - {min: 100, points: 3}
        - {min: 80, points: 2}
        - {min: 0, points: 1}

    energy:
      class_adjustments:
        "A+": 8
        A: 5
        B: 3
        C: 1
        D: 0
        E: -1
        F: -3
        G: -5
        H: -8

  thresholds:
    dream: 90
    very_interesting: 75
    interesting: 60
    archive: 40

land:
  hard_filters:
    min_plot_area: 1000
    forbidden_terms:
      - zwangversteigerung
      - zwangsversteigerung
    residential_building_required: true
    holiday_area_forbidden: true
    severe_noise_forbidden: true

  scoring:
    price:
      weight: 30
      brackets:
        - {max: 30000, points: 30}
        - {max: 40000, points: 25}
        - {max: 50000, points: 20}
        - {max: 60000, points: 10}
        - {max: null, points: 0}

    plot_area:
      weight: 20
      brackets:
        - {min: 5000, points: 20}
        - {min: 3000, points: 15}
        - {min: 2000, points: 10}
        - {min: 1500, points: 7}
        - {min: 1000, points: 3}

    water_distance:
      weight: 20
      brackets:
        - {max_km: 0.5, points: 20}
        - {max_km: 1.0, points: 18}
        - {max_km: 2.0, points: 15}
        - {max_km: 3.0, points: 10}
        - {max_km: null, points: 0}

    neighbours:
      weight: 20
      values:
        isolated: 20
        few_neighbours: 16
        loose_development: 9
        village_edge: 5
        village: 2
        dense: 0

    primary_residence:
      weight: 5
      values:
        confirmed: 5
        probable: 3
        unknown: 2
        forbidden: 0

    buildability:
      weight: 5
      values:
        BUILDING_PERMIT: 5
        PRELIMINARY_APPROVAL: 4
        CONSTRUCTIONPLAN: 4
        NEIGHBOURCONSTRUCTION: 3
        NO_INFORMATION: 0

  thresholds:
    dream: 90
    very_interesting: 75
    interesting: 60
    archive: 40
