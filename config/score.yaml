house:

  hard_filters:

    # Reeller Kaufpreis.
    # Zustandsaufschläge zählen NICHT für diesen KO-Filter.
    max_price: 300000

    # Unter 500 m² greift der harte Suchfilter.
    # 500-999 m² bleiben möglich, erhalten aber nur wenige Grundstückspunkte.
    min_plot_area: 500


  scoring:

    # --------------------------------------------------------
    # Preis + Zustand
    # --------------------------------------------------------

    price:

      weight: 25

      condition_surcharge:

        turnkey: 0
        good: 0
        maintained: 15000
        cosmetic_renovation: 40000
        renovation_needed: 80000
        major_renovation: 140000
        dilapidated: 220000
        unknown: 100000

      brackets:

        - max: 130000
          points: 25

        - max: 160000
          points: 22

        - max: 190000
          points: 19

        - max: 220000
          points: 16

        - max: 250000
          points: 13

        - max: 275000
          points: 9

        - max: 300000
          points: 5

        - max: 310000
          points: 0

        - max: 320000
          points: -5

        - max: 330000
          points: -15

        - max: 340000
          points: -25

        - max: 350000
          points: -35

        - max: null
          points: -40


    # --------------------------------------------------------
    # Grundstück
    # --------------------------------------------------------

    plot_area:

      weight: 20

      brackets:

        - min: 5000
          points: 20

        - min: 3000
          points: 18

        - min: 2000
          points: 16

        - min: 1500
          points: 14

        - min: 1000
          points: 11

        - min: 750
          points: 7

        - min: 500
          points: 3


    # --------------------------------------------------------
    # Freilage / Nachbarn
    # --------------------------------------------------------

    neighbours:

      weight: 25

      values:

        isolated: 25
        few_neighbours: 22
        loose_development: 17
        village_edge: 12
        village: 6
        dense: 0


    # --------------------------------------------------------
    # Ruhe
    # --------------------------------------------------------

    quiet:

      weight: 15


    # --------------------------------------------------------
    # Wasser
    # --------------------------------------------------------

    water:

      weight: 10


    # --------------------------------------------------------
    # Wohnfläche
    # --------------------------------------------------------

    living_area:

      weight: 5

      brackets:

        - min: 150
          points: 5

        - min: 120
          points: 4

        - min: 100
          points: 3

        - min: 80
          points: 2

        - min: 0
          points: 1


    # --------------------------------------------------------
    # Energie
    # --------------------------------------------------------

    energy:

      class_adjustments:

        "A+": 3
        A: 2
        B: 1
        C: 1
        D: 0
        E: -1
        F: -3
        G: -5
        H: -8


  thresholds:

    dream: 90
    very_interesting: 75
    interesting: 60
    archive: 40

land:

