# Example scoring profile for a public/self-hosted installation.
#
# These values are intentionally generic. Copy to score.yaml and adapt them to
# your own budget, property type, risk tolerance and location priorities.

house:
  hard_filters:
    # Purchase price plus known necessary condition costs; unknown condition stays open.
    max_price: 500000
    min_plot_area: 400

  scoring:
    price:
      weight: 25
      condition_surcharge:
        turnkey: 0
        good: 0
        maintained: 15000
        cosmetic_renovation: 40000
        renovation_needed: 80000
        major_renovation: 140000
        dilapidated: 220000
        unknown: 100000
      brackets:
        - {max: 250000, points: 25}
        - {max: 300000, points: 22}
        - {max: 350000, points: 18}
        - {max: 400000, points: 14}
        - {max: 450000, points: 9}
        - {max: 500000, points: 5}
        - {max: null, points: 0}

    plot_area:
      weight: 20
      brackets:
        - {min: 3000, points: 20}
        - {min: 2000, points: 18}
        - {min: 1500, points: 16}
        - {min: 1000, points: 13}
        - {min: 750, points: 10}
        - {min: 500, points: 6}
        - {min: 400, points: 3}

    neighbours:
      weight: 25
      values:
        isolated: 25
        few_neighbours: 22
        loose_development: 17
        village_edge: 12
        village: 6
        dense: 0

    quiet:
      weight: 15

    water:
      weight: 10

    living_area:
      weight: 5
      brackets:
        - {min: 150, points: 5}
        - {min: 120, points: 4}
        - {min: 100, points: 3}
        - {min: 80, points: 2}
        - {min: 0, points: 1}

    energy:
      class_adjustments:
        "A+": 3
        A: 2
        B: 1
        C: 1
        D: 0
        E: -1
        F: -3
        G: -5
        H: -8

  thresholds:
    dream: 90
    very_interesting: 75
    interesting: 60
    archive: 40

land:
  hard_filters:
    min_plot_area: 400
    forbidden_terms:
      - zwangsversteigerung
    residential_building_required: true
    holiday_area_forbidden: true
    severe_noise_forbidden: true

  scoring:
    price:
      weight: 30
      brackets:
        - {max: 50000, points: 30}
        - {max: 75000, points: 25}
        - {max: 100000, points: 20}
        - {max: 150000, points: 10}
        - {max: null, points: 0}

    plot_area:
      weight: 25
      brackets:
        - {min: 3000, points: 25}
        - {min: 2000, points: 22}
        - {min: 1500, points: 20}
        - {min: 1000, points: 15}
        - {min: 750, points: 10}
        - {min: 400, points: 5}

    water_distance:
      weight: 20
      brackets:
        - {max_km: 0.5, points: 20}
        - {max_km: 1.0, points: 18}
        - {max_km: 2.0, points: 15}
        - {max_km: 3.0, points: 10}
        - {max_km: null, points: 0}

    neighbours:
      weight: 15
      values:
        isolated: 15
        few_neighbours: 12
        loose_development: 10
        village_edge: 8
        village: 4
        dense: 0

    primary_residence:
      weight: 5
      values:
        confirmed: 5
        probable: 3
        unknown: 2
        forbidden: 0

    buildability:
      weight: 5
      values:
        BUILDING_PERMIT: 5
        PRELIMINARY_APPROVAL: 4
        CONSTRUCTIONPLAN: 4
        NEIGHBOURCONSTRUCTION: 3
        NO_INFORMATION: 0

  thresholds:
    dream: 90
    very_interesting: 75
    interesting: 60
    archive: 40
